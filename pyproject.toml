[tool.poetry]
name = "chatgpt-line-bot"
version = "2.0.0"
description = "AI寶寶 — a LINE assistant running on the Claude Code harness with GLM, sandboxed to ./workspace"
authors = ["hs_junxiang <jimmy871117@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

# Agent harness. Also needs the `claude` CLI on the host:
#   npm i -g @anthropic-ai/claude-code
claude-agent-sdk = "^0.2.144"

# Web service
fastapi = "^0.120.0"
uvicorn = "^0.35.0"
line-bot-sdk = "^3.5.0"
python-dotenv = "^1.0.0"

# Tools: web search + page reading (modules/web_search.py)
requests = "^2.31.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.2.2"
duckduckgo-search = "^8.1.1"

# Tools: image search (modules/image_crawler.py)
icrawler = "^0.6.7"
serpapi = "^0.1.5"

# Tools: image / video generation + image reasoning (agent_core/tools.py)
zhipuai = "*"
# Downscales photos before they go to the vision model (5MB / 6000px limit)
pillow = "^10.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
